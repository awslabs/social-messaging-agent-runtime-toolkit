[project]
# The distribution name on PyPI, where `socialagent` collides with the existing
# `social-agent` (ADR-0008). The import package and the console script stay
# `socialagent`.
name = "smart-socialagent"
dynamic = ["version"]
description = "Social Messaging Agent Runtime Toolkit — SDK for building WhatsApp AI agents on Amazon Bedrock AgentCore"
readme = "PYPI.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # 1.39.7 adds the bedrock-agentcore client; 1.39.14 adds the socialmessaging
    # WhatsApp template operations (list/create/delete_whatsapp_message_template).
    "boto3>=1.39.14",
    "cryptography>=46.0.5",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
]

[project.urls]
Homepage = "https://github.com/awslabs/social-messaging-agent-runtime-toolkit"
Repository = "https://github.com/awslabs/social-messaging-agent-runtime-toolkit"
Issues = "https://github.com/awslabs/social-messaging-agent-runtime-toolkit/issues"
Documentation = "https://github.com/awslabs/social-messaging-agent-runtime-toolkit/tree/main/docs"

[project.scripts]
socialagent = "socialagent.cli:main"

[build-system]
# >=1.27 is the floor for PEP 639: earlier hatchling rejects the SPDX-string
# `license` and the `license-files` list above as a hard build error, not a
# warning. Build backends resolve in build isolation and are absent from
# uv.lock, so this bound is the only thing pinning them.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
# VERSION is the one place the release number lives: pyproject, `socialagent
# --version`, the CHANGELOG heading and the git tag all read or match it.
path = "VERSION"
pattern = "^(?P<version>\\S+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/socialagent"]
# infra-terraform/ is the stack's Terraform, which the CLI materializes into a
# project's .socialagent/infra/ when there is no checkout to run it from
# (socialagent/cli/_infra.py). It is an only-include with a source rewrite
# rather than a force-include for two reasons. A force-include walks the whole
# directory and ignores `exclude`, so a contributor's .terraform/ (provider
# binaries), state and tfvars would ship. And a force-include whose source is
# missing aborts the build, while the Lambda layer and template-sync archives
# (packaging.tf, modules/templates) run `pip install .` on a tree without
# infra-terraform/; an only-include that is absent adds nothing.
only-include = ["src/socialagent", "infra-terraform"]
sources = { "infra-terraform" = "socialagent/cli/_assets/infra-terraform" }
# What Terraform writes into its own directories (state, lock file, build
# archives), deployment inputs that name an account (tfvars, backend configs,
# envs/), stray credentials and logs, and the mocked plan tests, which run only
# from a checkout. The root .gitignore already drops most of these; listed here
# so the wheel does not depend on it. Keep in step with _infra.EXCLUDED_DIRS,
# EXCLUDED_TOP_DIRS and EXCLUDED_FILES (tests/test_cli_infra.py checks).
exclude = [
    "/infra-terraform/**/.terraform/",
    "/infra-terraform/**/.build/",
    "/infra-terraform/**/terraform.tfstate.d/",
    "/infra-terraform/envs/",
    "/infra-terraform/tftest/",
    "/infra-terraform/**/*.tfstate",
    "/infra-terraform/**/*.tfstate.*",
    "/infra-terraform/**/*.tfvars",
    "/infra-terraform/**/*.tfvars.json",
    "/infra-terraform/**/.terraform.lock.hcl",
    "/infra-terraform/**/backend-*.hcl",
    "/infra-terraform/**/*.zip",
    "/infra-terraform/**/.env",
    "/infra-terraform/**/.env.*",
    "/infra-terraform/**/*.pem",
    "/infra-terraform/**/*.key",
    "/infra-terraform/**/*.log",
    "/infra-terraform/**/*.swp",
]
# Editable installs (`uv sync`) put src/ on the path, as `packages` did. Without
# this, hatch's detection maps every .py it includes, and the source rewrite of
# infra-terraform/modules/event-api/authorizer.py is one it refuses.
dev-mode-dirs = ["src"]

# blueprints/, recipes/ and packages/socialagent-runtime/ are template-as-code that the
# CLI copies into new projects. They live at the repo root, so without this the
# wheel ships the CLI but none of the data it needs and `socialagent init` fails on a
# pip install. socialagent/cli/_assets.py resolves these packaged paths first.
[tool.hatch.build.targets.wheel.force-include]
"blueprints" = "socialagent/cli/_assets/blueprints"
"recipes" = "socialagent/cli/_assets/recipes"
"packages/socialagent-runtime" = "socialagent/cli/_assets/socialagent-runtime"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: builds a wheel and installs it into a venv (deselect with '-m \"not slow\"')",
    "architecture: enforces the layering rules in AGENTS.md (run with '-m architecture')",
    "e2e: runs the real socialagent console script as a subprocess, AWS walled off (run with '-m e2e')",
    "bedrock: e2e test that calls Amazon Bedrock; skipped unless SOCIALAGENT_E2E_BEDROCK=1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.7",
    # Real DynamoDB conditional-expression semantics. A hand-rolled stub would
    # assert against our own model of DynamoDB, which is worthless for bugs that
    # live in the conditional expressions themselves. The console backend already
    # depends on moto; only the dynamodb extra is needed here, not moto[all].
    "moto[dynamodb]>=5.0",
    # The e2e tests run `socialagent dev`, which imports a scaffolded agent.py
    # in this interpreter. Same spec as the blueprints' requirements.txt.
    "bedrock-agentcore[strands-agents]>=1.18.1",
]

[tool.ruff.lint]
# projects/ handler files intentionally set up logging before imports (Lambda cold-start fix)
# projects/ agent.py files have a comment block between imports by design
per-file-ignores = { "projects/**/*.py" = ["E402"], "blueprints/**/*.py" = ["E402"] }
