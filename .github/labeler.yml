# What kind of review a pull request needs, from the files it changes; read by
# .github/workflows/labels.yml. CODEOWNERS still decides who reviews. Globs are
# minimatch, matched against the path from the repository root, dotfiles
# included. tests/test_pr_labels.py fails when a tracked file, changed alone,
# gets no label or more than one, and pins the boundary cases below.
#
# A label sets how closely a reviewer looks, so docs-only is only for
# documentation that no code reads and no project receives: Markdown outside
# the trees below, anything under docs/ (today also its diagrams and images),
# and LICENSE and NOTICE, which the wheel carries only as licence files. The
# other labels match a file only when it is not Markdown (all-globs-to-any-file
# with "!**/*.md": one file must match both), so a pull request that changes
# only socialagent-admin-console/README.md is docs-only, not console. The
# exceptions are whole trees that ship, and the Markdown that instructs an
# agent or carries the security posture, listed in both places below so that
# each lands on exactly one label:
#   - infra: everything under infra-terraform/, which ships in the wheel and
#     which the CLI copies into a project when it has no checkout.
#   - runtime: everything under blueprints/ and recipes/, which ship in the
#     wheel and which `socialagent init` and `socialagent recipe add` copy into
#     projects (READMEs, skills and agent instructions included), and PYPI.md,
#     the published PyPI page.
#   - console: the admin console's AGENTS.md and CLAUDE.md.
#   - ci: everything under .github/, every other AGENTS.md and CLAUDE.md, which
#     instruct the coding agents that work on this repository (CONTRIBUTING.md
#     has reviewers read them first), and the security policy, the threat model
#     and the data flows: the paths CODEOWNERS gives the security owner, beside
#     the CI and release machinery that enforces them.
#
# The labeler reads each changed file's new path only, so a rename is labelled
# by where the file lands: moving SECURITY.md under docs/ reads as docs-only.

docs-only:
  - all:
      - changed-files:
          # any-glob-to-all-files needs one glob to match every file, so the
          # documentation globs are one brace set: docs/a.png with README.md
          # is still docs-only.
          - any-glob-to-all-files: "{docs/**,**/*.md,LICENSE,NOTICE}"
          - all-globs-to-all-files:
              - "!{blueprints,recipes,infra-terraform,.github}/**"
              - "!**/{AGENTS,CLAUDE}.md"
              - "!PYPI.md"
              - "!{SECURITY.md,docs/threat-model.*,docs/data-flows.md}"

infra:
  - changed-files:
      - any-glob-to-any-file: "infra-terraform/**"

# The CLI, the runtime package, the blueprints and recipes a project copies,
# their tests, and what pins their dependencies and version.
runtime:
  - changed-files:
      - all-globs-to-any-file:
          - "{src/**,packages/**,blueprints/**,recipes/**,tests/**,pyproject.toml,uv.lock,VERSION}"
          - "!**/*.md"
      - any-glob-to-any-file: ["{blueprints,recipes}/**", "PYPI.md"]

console:
  - changed-files:
      - all-globs-to-any-file: ["socialagent-admin-console/**", "!**/*.md"]
      - any-glob-to-any-file: "socialagent-admin-console/**/{AGENTS,CLAUDE}.md"

ci:
  - changed-files:
      - all-globs-to-any-file:
          - "{scripts/**,Makefile,.ash.yaml,.gitignore}"
          - "!**/*.md"
      - any-glob-to-any-file: "{.github/**,SECURITY.md,docs/threat-model.*,docs/data-flows.md}"
      - all-globs-to-any-file:
          - "**/{AGENTS,CLAUDE}.md"
          - "!{blueprints,recipes,socialagent-admin-console}/**"
