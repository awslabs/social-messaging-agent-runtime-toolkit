# Weekly version updates for the root uv project, the admin console backend
# and UI, the requirements each blueprint copies into a scaffolded project,
# the Terraform provider constraints, and the actions these workflows use. The
# Terraform roots commit no lock file, so Dependabot proposes only raises of
# an upper bound: the `hashicorp/aws` ceiling of the stack and bootstrap roots
# and the admin console's `~> 5.0`; their other providers are open-ended `>=`.
# The blueprint Dockerfiles are left out on purpose: their base image is the
# floating python:3.12-slim tag, which every CodeBuild run pulls fresh. Every
# entry groups minor and patch bumps, so a week of them arrives as one PR per
# entry, and a major bump arrives alone, so it can be tested on its own. A few
# groups cut across that: packages that only work at matching versions (React,
# Amplify, the Vite toolchain) arrive together whatever the update type, and
# ruff arrives alone because a minor release can add lint rules. `hashicorp/aws`
# majors are not proposed: a provider major is a planned migration (in the
# admin console it changes the Cognito and IAM resources), not a weekly bump.
# uv, pip and npm raise a range's floor only when the new version needs it,
# so a published `smart-socialagent` never asks for a newer dependency than it
# needs and constrains its users' environments no more than it must; uv.lock
# still moves to the latest release. The workflows pin every action to a full
# commit SHA with the release tag in a trailing comment; Dependabot moves both.
#
# Every entry has a cooldown: a release is not proposed until it is 7 days old,
# so a compromised or yanked version has time to be caught upstream before it
# lands here. Major bumps wait 30 days where the ecosystem supports per-SemVer
# cooldowns (uv, pip, npm); Terraform and Actions only take `default-days`.
# Security updates ignore the cooldown and still open immediately.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      python-minor-patch:
        update-types: [minor, patch]
        # A ruff minor can enable new default rules and fail lint, so it comes
        # in its own PR with the config change it needs.
        exclude-patterns: ["ruff"]

  - package-ecosystem: pip
    directory: /socialagent-admin-console/backend
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  # Scaffolded projects install these as-is, so a vulnerable pin here ships to
  # every adopter. The packaging suite in CI installs and boots each blueprint,
  # which is what tests an update.
  - package-ecosystem: pip
    directories:
      - /blueprints/minimal
      - /blueprints/personal-assistant
      - /blueprints/appointment-scheduler
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      blueprints-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /socialagent-admin-console
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # These packages only work at matching versions, so every bump to them,
      # a major included, arrives as one PR per group. Listed before
      # ui-minor-patch because a dependency joins the first group it matches.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # The console's sign-in client: test sign-in (Cognito + TOTP) on a
      # deployed console before merging.
      amplify:
        patterns: ["aws-amplify", "@aws-amplify/*"]
      vite:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*"]
      ui-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directories:
      - /infra-terraform
      - /infra-terraform/bootstrap
      - /socialagent-admin-console/infra-terraform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # One PR raises the stack's and the bootstrap's `hashicorp/aws` ceiling
      # together, so the two roots stay on the same provider range. Deploy a
      # stack on the new range before merging (see `infra-terraform/versions.tf`).
      terraform-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
